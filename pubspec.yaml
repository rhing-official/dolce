name: dolce
description: A local e-book reader for PDF, CBZ and EPUB files.
publish_to: 'none'
version: 1.4.1+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  archive: ^4.0.9
  flutter_riverpod: ^2.6.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  file_picker: ^8.3.7
  go_router: ^14.6.2
  photo_view: ^0.15.0
  uuid: ^4.5.1
  path: ^1.9.0
  crypto: ^3.0.3
  window_manager: ^0.4.2
  docman: ^1.2.0
  package_info_plus: ^9.0.1
  pdfrx: ^2.4.8
  url_launcher: ^6.3.3
  xml: ^7.0.1
  flutter_widget_from_html_core: ^0.17.4
  html: ^0.15.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  flutter_lints: ^4.0.0
  msix: ^3.16.7

flutter:
  uses-material-design: true
  generate: true

msix_config:
  display_name: dolce-reader
  publisher_display_name: Rhing
  identity_name: Rhing.komichi
  publisher: CN=05798F0E-41EC-4FF9-BBAB-61384063660A
  msix_version: 1.4.1.0
  logo_path: icon/dolce-512.png
  capabilities: broadFileSystemAccess
  store: true
  install_certificate: false